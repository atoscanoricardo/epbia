<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Capacitación IA, Excel y Power BI</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Ruta de aprendizaje integral: De Excel a la Inteligencia Artificial">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Tema Moderno (Mojo) -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <style>
    :root {
      --theme-color: #2563eb; /* Azul Moderno */
    }
    .markdown-section {
      max-width: 800px;
      padding: 30px 45px 40px;
    }
    nav.app-nav li ul {
      min-width: 100px;
    }
    /* Estilo para las tablas de Excel */
    table {
      display: table;
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 1rem;
    }
    /* Mejora de legibilidad */
    body {
      font-size: 16px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div id="app">Cargando la experiencia de aprendizaje...</div>
  <script>
    window.$docsify = {
      name: 'Capacitación TI',
      repo: 'https://github.com/atoscanoricardo/epbia',
      loadSidebar: true,
      loadNavbar: true,
      coverpage: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Buscar tema...',
        noData: 'No se encontraron resultados',
        depth: 6
      },
      pagination: {
        previousText: 'Anterior',
        nextText: 'Siguiente',
        crossChapter: true,
        crossChapterText: true,
      },
      copyCode: {
        buttonText : 'Copiar código',
        errorText  : 'Error',
        successText: '¡Copiado!'
      }
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-markdown.min.js"></script>
</body>
</html>
