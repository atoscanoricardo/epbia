<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Capacitación IA, Excel y Power BI</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Ruta de aprendizaje integral: De Excel a la Inteligencia Artificial">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <style>
    :root {
      --theme-color: #2563eb;
    }
    
    /* Estilos Generales Simplificados */
    .markdown-section {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px;
    }

    /* Portada Limpia */
    section.cover {
      background: #ffffff !important;
    }

    section.cover .cover-main {
      text-align: center !important;
      color: #1e293b !important;
    }

    section.cover h1 {
      font-size: 3rem !important;
      font-weight: 800 !important;
      color: #1e293b !important;
    }

    /* Estilos para el contenido de herramientas */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 40px;
    }
    
    .tool-card {
      padding: 20px;
      background: #f8fafc;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }
  </style>
</head>
<body>
  <div id="app">Cargando...</div>
  <script>
    window.$docsify = {
      name: 'Capacitación TI',
      repo: 'https://github.com/atoscanoricardo/epbia',
      loadSidebar: true,
      loadNavbar: true,
      coverpage: true,
      auto2top: true,
      search: 'auto',
      pagination: {
        previousText: 'Anterior',
        nextText: 'Siguiente',
      },
      copyCode: {
        buttonText : 'Copiar',
        successText: '¡Copiado!'
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-markdown.min.js"></script>
</body>
</html>
